<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 185" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Outfit:wght@300;400;500&amp;display=swap');
      .headline-serif {
        font-family: 'Playfair Display', 'Bodoni MT', 'Didot', 'Cormorant Garamond', Georgia, serif;
        font-size: 96px;
        font-weight: 500;
        fill: #111111;
        letter-spacing: -0.015em;
      }
      .headline-sans {
        font-family: 'Outfit', 'Sora', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 82px;
        font-weight: 300;
        fill: #555555;
        letter-spacing: 0.005em;
      }
    </style>
  </defs>

  <!-- Line 1: THE FUTURE INSPIRES US -->
  <text x="0" y="82" class="headline-serif">THE FUTURE INSPIRES US</text>

  <!-- Line 2: WE WORK TO INSPIRE -->
  <text x="2" y="165" class="headline-sans">WE WORK TO INSPIRE</text>
</svg>
